<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - VoiceBox</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="page">

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="logo-badge">
          <svg viewBox="0 0 60 62"><g transform="translate(-24,-23)"><path fill-rule="evenodd" d="M67.70,26.45 L57.81,23.63 L50.47,23.63 L45.10,24.76 L35.49,29.56 L30.69,34.08 L27.87,38.04 L24.48,47.36 L24.48,57.25 L25.89,62.62 L28.43,67.70 L31.26,71.38 L38.04,77.59 L37.75,79.85 L35.49,83.52 L35.78,84.37 L38.04,84.37 L46.51,80.98 L56.97,81.55 L65.16,79.57 L73.35,74.77 L80.13,67.14 L82.39,62.33 L83.81,56.68 L83.24,45.10 L78.16,34.93 L73.35,30.13 Z M37.19,42.56 L40.30,39.45 L44.25,38.04 L64.03,38.04 L66.29,38.60 L68.83,40.01 L70.81,41.99 L72.51,45.10 L72.79,57.81 L72.22,59.51 L69.96,62.62 L65.73,65.16 L52.16,65.16 L43.97,70.25 L42.56,69.12 L42.27,65.44 L40.01,64.03 L37.19,61.20 L35.78,57.81 L35.78,46.23 Z"/></g></svg>
        </span>
        <span style="color:#EC1561;">Voice</span><span style="color:#3A323F;">Box</span>
      </a>
      <div class="nav-links">
        <a href="index.html"><span class="label">Home</span></a>
      </div>
    </div>
  </nav>

  <main>
    <div class="container narrow center" style="padding-top:56px;">
      <div class="hero-badge small">
        <svg viewBox="0 0 24 24"><path d="M12,1L3,5v6c0,5.55 3.84,10.74 9,12c5.16,-1.26 9,-6.45 9,-12V5L12,1z M12,11.99h7c-0.53,4.12 -3.28,7.79 -7,8.94V12H5V6.3l7,-3.11V11.99z"/></svg>
      </div>
      <h1 style="font-size:24px; margin-bottom:8px;">Forgot Password</h1>
      <p class="text-secondary" style="margin-bottom:32px;">
        Enter your email and we'll send you a code to reset your password.
      </p>

      <form id="forgotForm" style="text-align:left;">
        <div class="field">
          <label>Email</label>
          <input type="email" id="inputEmail" placeholder="you@example.com">
          <div class="error-msg">Enter a valid email address.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnSendCode">
          <span class="btn-label">Send Reset Code</span>
          <span class="spinner"></span>
        </button>
      </form>

      <p class="center" style="margin-top:20px;">
        <a href="login.html" class="link-text">&larr; Back to Log In</a>
      </p>
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const emailField = document.getElementById("inputEmail");
    const email = emailField.value.trim();

    if (!isValidEmail(email)) {
      emailField.parentElement.classList.add("has-error");
      return;
    }
    emailField.parentElement.classList.remove("has-error");

    const button = document.getElementById("btnSendCode");
    setButtonLoading(button, true, "Sending...");

    try {
      const { data: emailCheck, error: checkError } = await supabaseClient.rpc("email_exists", { check_email: email });
      if (checkError) throw checkError;

      if (!emailCheck) {
        setButtonLoading(button, false);
        document.querySelector("#btnSendCode .btn-label").textContent = "Send Reset Code";
        emailField.parentElement.classList.add("has-error");
        showToast("No account found with this email.");
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
      if (error) throw error;

      window.location.href = "reset-password.html?email=" + encodeURIComponent(email);
    } catch (err) {
      setButtonLoading(button, false);
      document.querySelector("#btnSendCode .btn-label").textContent = "Send Reset Code";
      showToast(err.message || "Something went wrong. Please try again.");
    }
  });
</script>
</body>
</html>
