<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error Logs - VoiceBox</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="app.css">
<style>
  .filter-pill {
    background: var(--white);
    border: 1.5px solid var(--light-gray);
    border-radius: var(--radius-pill);
    padding: 8px 18px;
    font-size:13px;
    font-weight:700;
    color: var(--text-secondary);
    cursor:pointer;
  }
  .filter-pill.active { background: var(--primary); color:white; border-color:var(--primary); }

  table { width:100%; border-collapse: collapse; background:white; border-radius:var(--radius-md); overflow:hidden; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-secondary); padding:12px 14px; border-bottom:1px solid var(--light-gray); }
  td { padding:14px; border-bottom:1px solid var(--light-gray); font-size:13px; vertical-align:top; }
  .source-pill { display:inline-block; padding:4px 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:700; }
  .source-website { background:#E3F9EF; color:var(--status-resolved); }
  .source-android { background:#F3E8FF; color:#7C3AED; }
  .log-row { cursor:pointer; }
  .log-row:hover { background:#FAFAFA; }
  .stack-row td { background:#FAFAFA; font-family:monospace; font-size:12px; white-space:pre-wrap; color:var(--text-secondary); display:none; }
  .stack-row.open td { display:table-cell; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); }
</style>
</head>
<body>
<div style="max-width:1000px; margin:0 auto; padding:32px 20px;">

  <div id="loginGate" style="display:none;">
    <div class="card" style="max-width:400px; margin:80px auto; padding:32px;">
      <h2 style="margin-bottom:16px;">Admin sign-in required</h2>
      <p style="color:var(--text-secondary); font-size:14px;">
        Please sign in through the <a href="staff-portal.html">staff portal</a> first.
      </p>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 style="font-size:22px;">Error Logs</h1>
      <a href="staff-portal.html" class="btn btn-outline" style="padding:8px 18px; font-size:13px;">Back to Portal</a>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:20px;">
      <div class="filter-pill active" data-source="all" onclick="setFilter('all')">All</div>
      <div class="filter-pill" data-source="website" onclick="setFilter('website')">Website</div>
      <div class="filter-pill" data-source="android" onclick="setFilter('android')">Android</div>
    </div>

    <table id="logsTable">
      <thead>
        <tr>
          <th>Time</th>
          <th>Source</th>
          <th>Message</th>
          <th>Page / Screen</th>
          <th>User</th>
        </tr>
      </thead>
      <tbody id="logsBody"></tbody>
    </table>

    <div id="emptyState" class="empty-state" style="display:none;">No error logs found.</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  let allLogs = [];
  let currentFilter = "all";

  async function checkAdminAndLoad() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      document.getElementById("loginGate").style.display = "block";
      return;
    }
    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", session.user.id)
      .single();
    if (!profile || profile.role !== "admin") {
      document.getElementById("loginGate").style.display = "block";
      return;
    }
    document.getElementById("mainContent").style.display = "block";
    loadLogs();
  }

  async function loadLogs() {
    const { data, error } = await supabaseClient
      .from("error_logs")
      .select("id, source, message, stack_trace, page_or_screen, user_id, user_agent, created_at")
      .order("created_at", { ascending: false })
      .limit(200);

    if (error) {
      console.error("Failed to load error logs:", error);
      return;
    }
    allLogs = data || [];
    renderLogs();
  }

  function setFilter(source) {
    currentFilter = source;
    document.querySelectorAll(".filter-pill").forEach((el) => {
      el.classList.toggle("active", el.dataset.source === source);
    });
    renderLogs();
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleString();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function renderLogs() {
    const filtered = currentFilter === "all"
      ? allLogs
      : allLogs.filter((l) => l.source === currentFilter);

    const body = document.getElementById("logsBody");
    const emptyState = document.getElementById("emptyState");

    if (filtered.length === 0) {
      body.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    body.innerHTML = filtered.map((log, i) => `
      <tr class="log-row" onclick="toggleStack(${i})">
        <td>${formatDate(log.created_at)}</td>
        <td><span class="source-pill source-${log.source}">${escapeHtml(log.source)}</span></td>
        <td>${escapeHtml(log.message)}</td>
        <td>${escapeHtml(log.page_or_screen || "\u2014")}</td>
        <td>${log.user_id ? "Logged in" : "Anonymous"}</td>
      </tr>
      <tr class="stack-row" id="stack-${i}">
        <td colspan="5"><div style="font-family:sans-serif; color:var(--text-secondary); margin-bottom:8px;">${escapeHtml(log.user_agent) || "Device/browser info not available."}</div>${escapeHtml(log.stack_trace) || "No stack trace available."}</td>
      </tr>
    `).join("");
  }

  function toggleStack(i) {
    document.getElementById(`stack-${i}`).classList.toggle("open");
  }

  checkAdminAndLoad();
</script>
</body>
</html>
